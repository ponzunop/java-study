<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Java Quest: MyKakeibo RPG — ゲームで学ぶJava全14回</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hud">
      <div class="hud-brand">
        <div class="brand-badge">JAVA RPG</div>
        <div>
          <h1>Java Quest: MyKakeibo RPG</h1>
          <p class="subtitle">全14回「家計簿Webアプリ → DB・API・テスト・Spring Boot」連動ゲーム</p>
        </div>
      </div>

      <div class="hud-stats">
        <div class="stat-pill level-pill">
          <span class="stat-label" id="player-title">Java見習い勇者</span>
          <strong id="player-level">Lv.1</strong>
          <div class="mini-bar"><div id="exp-bar-fill" class="mini-bar-fill exp"></div></div>
          <small id="exp-text">0 / 80 EXP</small>
        </div>
        <div class="stat-pill">
          <span class="stat-label">総クリア</span>
          <strong id="hud-cleared">0 / 14章</strong>
          <small id="hud-stars">★ 0 / 42</small>
        </div>
        <div class="stat-pill">
          <span class="stat-label">修復・パズル</span>
          <strong id="hud-quests">0 / 28</strong>
          <small id="hud-puzzles">パズル 0 / 14</small>
        </div>
        <div class="stat-pill">
          <span class="stat-label">戦績</span>
          <strong id="hud-accuracy">正答率 0%</strong>
          <small id="hud-combo">最大コンボ 0</small>
        </div>
        <div class="stat-pill">
          <span class="stat-label">コイン</span>
          <strong id="hud-coins">0 G</strong>
          <small id="hud-items">🧪1 🔍1 🧿0</small>
        </div>
      </div>

      <div class="hud-actions">
        <button id="btn-unlock-all" class="btn btn-ghost btn-sm" title="全ステージを解放して好きな章から挑戦できます">全章アンロック</button>
        <button id="btn-sound" class="btn btn-ghost btn-sm" title="効果音のON/OFF">🔊 効果音 ON</button>
        <button id="btn-open-lectures" class="btn btn-ghost btn-sm" type="button">📚 講義資料</button>
        <button id="btn-reset" class="btn btn-danger btn-sm">記録リセット</button>
      </div>
    </header>

    <nav class="nav-tabs" aria-label="ゲームメニュー">
      <button class="nav-tab active" data-view="map">🗺️ 冒険マップ</button>
      <button class="nav-tab" data-view="quests">💻 コード修復</button>
      <button class="nav-tab" data-view="puzzles">🧩 コード構築パズル</button>
      <button class="nav-tab" data-view="glossary">📖 用語集</button>
      <button class="nav-tab" data-view="shop">🛒 アイテムショップ</button>
      <button class="nav-tab" data-view="review">⚡ 弱点特訓 <span id="weak-count-badge" class="count-badge">0</span></button>
      <button class="nav-tab" data-view="survival">⏱️ ランダム10問試験</button>
      <button class="nav-tab" data-view="badges">🏆 図鑑・バッジ</button>
    </nav>

    <main id="main-content" class="main-content">
      <!-- Views rendered by app.js -->
    </main>
  </div>

  <!-- Stage Briefing Modal -->
  <div id="briefing-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="briefing-title">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="stage-chip" id="briefing-area">AREA</span>
          <h2 id="briefing-title">ステージタイトル</h2>
          <p id="briefing-subtitle" class="muted"></p>
        </div>
        <button id="briefing-close" class="btn btn-ghost btn-sm" aria-label="閉じる">✕</button>
      </div>
      <div id="briefing-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="briefing-lesson-link" type="button" class="btn btn-ghost">📖 元の講義資料を読む</button>
        <button id="briefing-start-battle" class="btn btn-primary btn-lg">⚔️ モンスターと戦う（10問）</button>
      </div>
    </div>
  </div>

  <!-- Lecture Reader Modal -->
  <div id="lecture-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="lecture-modal-title">
    <div class="modal-card modal-card-wide">
      <div class="modal-header lecture-modal-header">
        <div class="lecture-header-main">
          <div class="lecture-title-row">
            <span class="stage-chip">📚 講義資料リーダー</span>
            <h2 id="lecture-modal-title">カリキュラム目次</h2>
          </div>
          <div class="lecture-nav-controls">
            <select id="lecture-select" class="blank-select lecture-select" aria-label="講義を選択"></select>
            <button id="lecture-prev" type="button" class="btn btn-ghost btn-sm">◀ 前へ</button>
            <button id="lecture-next" type="button" class="btn btn-ghost btn-sm">次へ ▶</button>
          </div>
        </div>
        <button id="lecture-close" type="button" class="btn btn-ghost btn-sm" aria-label="閉じる">✕</button>
      </div>
      <div id="lecture-modal-scroll" class="modal-body lecture-modal-body">
        <div class="lecture-helper-bar">
          💡 点線のついた用語（例：<button type="button" class="glossary-inline" data-glossary-id="compile">コンパイル</button>）をタップすると意味が表示されます
        </div>
        <article id="lecture-body" class="lecture-paper"></article>
      </div>
      <div class="modal-footer lecture-modal-footer">
        <button id="lecture-open-glossary" type="button" class="btn btn-ghost btn-sm">📖 用語集を開く</button>
        <button id="lecture-close-bottom" type="button" class="btn btn-primary btn-sm">ゲームに戻る</button>
      </div>
    </div>
  </div>

  <!-- Glossary Detail Popup Modal -->
  <div id="glossary-modal" class="modal modal-top hidden" role="dialog" aria-modal="true" aria-labelledby="glossary-modal-term">
    <div class="modal-card glossary-modal-card">
      <div class="modal-header">
        <div>
          <span class="stage-chip" id="glossary-modal-meta">用語解説</span>
          <h2 id="glossary-modal-term">コンパイル</h2>
          <p id="glossary-modal-reading" class="muted"></p>
        </div>
        <button id="glossary-close" type="button" class="btn btn-ghost btn-sm" aria-label="閉じる">✕</button>
      </div>
      <div id="glossary-modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="glossary-goto-all" type="button" class="btn btn-ghost btn-sm">📖 用語集タブで他の用語も見る</button>
        <button id="glossary-ok" type="button" class="btn btn-primary btn-sm">わかった！</button>
      </div>
    </div>
  </div>

  <script src="data/stages.js"></script>
  <script src="data/glossary.js"></script>
  <script src="markdown.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
